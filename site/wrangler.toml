# Hire Driver Japan: un solo Worker serve sito statico (dist/), API, /verify e pannello.
# Progetto e database SEPARATI da DRIVEN Tokyo.
name = "hdj-site"
main = "worker/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "hiredriverjapan.com", custom_domain = true },
  { pattern = "www.hiredriverjapan.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"   # serve dist/404.html con status 404

# Video della HDJ Academy (privati: serviti solo dal Worker con link firmato)
[[r2_buckets]]
binding = "ACADEMY"
bucket_name = "hdj-academy"

[[d1_databases]]
binding = "DB"
database_name = "hdj-data"
database_id = "8f355aee-c240-4828-9240-b9f9644856c7"

[vars]
SITE_URL = "https://hiredriverjapan.com"
BRAND_NAME = "HIRE driver japan"
CERT_NAME = "VVIP Service Certificate"
CONTACT_EMAIL = "info@hiredriverjapan.com"      # inoltrata da Cloudflare a driventokyo@gmail.com
FROM_EMAIL = ""         # mittente su dominio verificato, es. "HIRE driver japan <info@hiredriverjapan.com>"
# Fattura provvigioni (適格請求書): emittente legale, indirizzo, numero di registrazione T+13 cifre, coordinate bancarie
INVOICE_ISSUER = "6株式会社"
INVOICE_ADDRESS = "徳島県板野郡藍住町笠木字中野137"
INVOICE_REG_NO = ""
INVOICE_BANK = ""

# Segreti (wrangler secret put): ADMIN_TOKEN, RESEND_API_KEY, TURNSTILE_SECRET, ACADEMY_SECRET (firma dei link video), STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET (account Stripe di HDJ, separato da Driven)
[triggers]
crons = ["0 0 * * *"]   # 09:00 JST: scadenze certificati, rinnovi a 60 e 30 giorni, riepilogo email
