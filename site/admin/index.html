<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pannello · HIRE driver japan</title>
<link rel="icon" href="/assets/favicon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#14202b;--mut:#5b6875;--line:#d9dee3;--bg:#f4f5f7;--acc:#1d5c86;--gold:#a8842f;--ok:#1d6b3a;--err:#a1281f}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:3}
header b{color:var(--gold)}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:#cfd7de;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:#2b3a48;color:#fff}.cnt{background:var(--gold);color:var(--ink);border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:700}
#who{margin-left:auto;font-size:12px;color:#9aa6b1}
main{padding:16px;max-width:1400px;margin:0 auto}
.login{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #b9c2ca;border-radius:6px;background:#fff;width:100%}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}button.b.s{background:#fff;color:var(--acc);border:1px solid var(--acc)}button.b.r{background:var(--err)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:#e9ecef;border-radius:8px;padding:8px;min-height:120px}.col h4{margin:4px 4px 8px;font-size:12px;text-transform:uppercase;color:var(--mut)}
.it{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}.it small{color:var(--mut)}
.it .t{font-weight:600}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line)}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef1f4;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.row>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);min-width:140px;flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;background:#eef1f4}.tag.active,.tag.pass{background:#e3f3e8;color:var(--ok)}.tag.expired,.tag.retake{background:#fdf1dc;color:#8a5a00}.tag.revoked,.tag.fail{background:#fbe5e3;color:var(--err)}
dialog{border:0;border-radius:10px;max-width:720px;width:95%;padding:0}dialog .in{padding:18px}dialog pre{white-space:pre-wrap;background:#f6f7f9;padding:10px;border-radius:6px;max-height:300px;overflow:auto}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sub button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}.sub button.on{background:var(--ink);color:#fff}
.msg{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;max-width:420px}
td input[type=number]{width:70px}
</style>
</head>
<body>
<header><b>HIRE</b> driver japan · <span id="ptitle">pannello / 管理画面</span><nav id="tabs"></nav><span id="who"></span></header>
<main id="app"></main>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>
<div class="msg" id="msg"></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
let TOKEN=null, ME=null;
try{TOKEN=localStorage.getItem("hdj_token")}catch(_){}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",3500)};
async function api(path,body){const r=await fetch("/api/admin"+path,{method:body?"POST":"GET",headers:{"x-panel-token":TOKEN,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error("unauthorized")}const j=await r.json();if(!j.ok){toast("Errore: "+(j.hint||j.error));throw new Error(j.error)}return j}
function logout(){try{localStorage.removeItem("hdj_token")}catch(_){}TOKEN=null;login()}
const L={en:"Inglese",zh:"Cinese",it:"Italiano",fr:"Francese",es:"Spagnolo",ja:"Giapponese",other:"Altro"};
const langs=j=>{try{return JSON.parse(j||"[]").map(x=>L[x]||x).join(", ")}catch(_){return j||""}};
const d10=s=>(s||"").slice(0,10);

function login(){$("#tabs").innerHTML="";$("#who").textContent="";
  app.innerHTML=`<form class="login" id="lf"><h2>Accesso・ログイン</h2><p>Incolla il token che ti e' stato consegnato.<br>お渡ししたトークンを貼り付けてください。</p><input id="tk" type="password" autocomplete="current-password" required><p><button class="b">Entra・ログイン</button></p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();TOKEN=$("#tk").value.trim();try{const j=await api("/me");try{localStorage.setItem("hdj_token",TOKEN)}catch(_){}ME=j.user;start()}catch(_){toast("Token non valido")}}}

const TABS_ADMIN=[["leads","Richieste"],["refs","Segnalazioni"],["stmts","Estratti conto"],["acad","Academy"],["people","Anagrafiche"],["courses","Sessioni"],["certs","Certificati"],["renew","Rinnovi"],["users","Utenti"],["export","Export"]];
const TABS_TEACHER=[["courses","Le mie sessioni"]];
const TABS_OPERATOR=[["refs","案件ボード"],["stmts","請求書"],["acad","研修の進捗"],["certs","乗務員の認証"]];
async function start(){
  const tabs=ME.role==="admin"?TABS_ADMIN:ME.role==="teacher"?TABS_TEACHER:TABS_OPERATOR;
  $("#ptitle").textContent=ME.role==="operator"?"提携事業者さま専用画面":"pannello";
  $("#who").innerHTML=ME.role==="operator"?`${esc(ME.name)} · <a href="#" id="lo" style="color:#9aa6b1">ログアウト</a>`:`${esc(ME.name)} · ${esc(ME.role)} · <a href="#" id="lo" style="color:#9aa6b1">esci</a>`;$("#lo").onclick=e=>{e.preventDefault();logout()};
  $("#tabs").innerHTML=tabs.map(([k,t])=>`<button data-t="${k}">${t}<span class="cnt" id="c-${k}" hidden></span></button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)};
  show(tabs[0][0]);counts();setInterval(counts,60000);
}
async function counts(){try{const c=(await api("/counts")).counts;const n=(c.service||0)+(c.training||0)+(c.driver||0);const a=$("#c-leads");if(a){a.hidden=!n;a.textContent=n}const r=$("#c-renew");if(r){r.hidden=!c.expiring;r.textContent=c.expiring}const o=$("#c-refs");if(o&&ME.role==="operator"){o.hidden=!c.open_jobs;o.textContent=c.open_jobs}document.title=(ME.role==="operator"?(c.open_jobs?`(${c.open_jobs}) `:"")+"案件ボード":(n?`(${n}) `:"")+"Pannello")+" · HIRE driver japan"}catch(_){}}
function show(t){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({leads,refs,stmts,acad,people,courses,certs,renew,users,exp:exportTab,export:exportTab})[t]()}

// ---- Richieste: pipeline
let leadKind="service";
const STAGES={service:["new","contacted","quoted","confirmed","lost"],training:["new","contacted","quoted","confirmed","lost"],driver:["new","interview","documents","hired","rejected"]};
const SLAB={new:"Nuove",contacted:"Contattate",quoted:"Preventivo inviato",confirmed:"Confermate",lost:"Perse",interview:"Colloquio",documents:"Documenti",hired:"Assunti",rejected:"Scartati"};
async function leads(){
  app.innerHTML=`<div class="sub">${[["service","Aziende e operatori"],["training","Formazione"],["driver","Candidature autisti"]].map(([k,t])=>`<button data-k="${k}" class="${k===leadKind?"on":""}">${t}</button>`).join("")}</div><div class="kan" id="kan"></div>`;
  app.querySelector(".sub").onclick=e=>{const b=e.target.closest("button");if(b){leadKind=b.dataset.k;leads()}};
  const rows=(await api("/leads/"+leadKind)).rows;
  $("#kan").innerHTML=STAGES[leadKind].map(s=>`<div class="col"><h4>${SLAB[s]} (${rows.filter(r=>r.stage===s).length})</h4>${rows.filter(r=>r.stage===s).map(r=>`<div class="it" data-id="${r.id}"><div class="t">${esc(r.company||r.full_name)}</div><small>${esc(r.id)} · ${d10(r.created_at)} · ${esc(r.site_lang)}${r.kind?" · "+(r.kind==="corporate"?"azienda":"operatore"):""}</small><br><small>${esc(r.plan||r.operator_type||r.license||"")} ${r.drivers_count?"· "+r.drivers_count+" autisti":""} ${r.languages?"· "+langs(r.languages):""}</small></div>`).join("")}</div>`).join("");
  $("#kan").onclick=e=>{const it=e.target.closest(".it");if(it)leadDlg(rows.find(r=>r.id===it.dataset.id))};
}
function leadDlg(r){
  const skip=["ip_hash","turnstile_ok"];const info=Object.entries(r).filter(([k,v])=>v!=null&&v!==""&&!skip.includes(k)).map(([k,v])=>`${k}: ${k==="languages"?langs(v):v}`).join("\n");
  $("#dlgin").innerHTML=`<h3>${esc(r.company||r.full_name)} <small>${esc(r.id)}</small></h3><pre>${esc(info)}</pre>
  <div class="row"><label>Stato<select id="ds">${STAGES[leadKind].map(s=>`<option value="${s}"${s===r.stage?" selected":""}>${SLAB[s]}</option>`).join("")}</select></label>
  ${leadKind!=="driver"?`<label>Preventivo (yen, IVA esclusa)<input id="dq" type="number" value="${r.quote_jpy??""}"></label><label>Motivo perdita<input id="dl" value="${esc(r.lost_reason||"")}"></label>`:""}</div>
  <label style="font-size:12px;color:#5b6875">Note interne<textarea id="dn" rows="3">${esc(r.notes||"")}</textarea></label>
  <p class="row"><button class="b" id="dsave">Salva</button><button class="b s" onclick="dlg.close()">Chiudi</button>${leadKind==="service"?`<button class="b s" id="mkref">Invia ai membri</button>`:""}${leadKind==="driver"&&r.stage==="hired"&&!r.driver_id?`<button class="b s" id="mkdrv">Crea scheda autista</button>`:""}</p>`;
  dlg.showModal();
  $("#dsave").onclick=async()=>{const b={stage:$("#ds").value,notes:$("#dn").value};if(leadKind!=="driver"){b.quote_jpy=$("#dq").value;b.lost_reason=$("#dl").value}await api(`/leads/${leadKind}/${r.id}`,b);dlg.close();toast("Salvato");leads();counts()};
  const rf=$("#mkref");if(rf)rf.onclick=()=>{dlg.close();PREF={lead_id:r.id,client_name:r.contact_name,client_company:r.company,client_email:r.email,client_phone:r.phone,client_lang:r.site_lang,service_date:r.service_date,request:[r.plan,r.hours?r.hours+"h":"",r.vehicle,r.city,r.message].filter(Boolean).join(" · ")};show("refs")};
  const mk=$("#mkdrv");if(mk)mk.onclick=async()=>{const j=await api("/drivers",{full_name:r.full_name,email:r.email,phone:r.phone,languages:JSON.parse(r.languages||"[]"),nishu_menkyo:r.license==="nishu"?1:0,employed_by_us:1});toast("Autista creato: "+j.id);dlg.close()};
}
const dlg=$("#dlg");

// ---- Anagrafiche
let OPS=[],DRV=[];
async function loadPeople(){OPS=ME.role==="admin"?(await api("/operators")).rows:[];DRV=(await api("/drivers")).rows}
async function people(){await loadPeople();
  app.innerHTML=`<div class="panel"><h3>Nuovo operatore</h3><div class="row"><label>Ragione sociale<input id="on"></label><label>Tipo<select id="ot"><option value="hire">hire</option><option value="taxi">taxi</option><option value="yakuin">yakuin sougei</option><option value="hotel">hotel</option><option value="dmc">DMC</option><option value="company">azienda (servizio autisti)</option><option value="other">altro</option></select></label><label>Citta<input id="oc"></label><label>Referente<input id="ocn"></label><label>Email<input id="oe"></label><label>Lingua<select id="ol"><option>ja</option><option>zh</option><option>en</option></select></label><button class="b" id="osave">Aggiungi</button></div></div>
  <div class="panel"><h3>Nuovo autista</h3><div class="row"><label>Nome completo<input id="dn2"></label><label>Nome in alfabeto latino<input id="dnl"></label><label>Operatore<select id="dop"><option value="">nessuno (nostro dipendente)</option>${OPS.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></label><label>Lingue (en,zh,it,fr,es)<input id="dlg2" placeholder="en,zh"></label><label>Mostra sul certificato<select id="ddm"><option value="initials">solo iniziali</option><option value="full">nome completo</option></select></label><label>Mostra operatore<select id="dso"><option value="0">no</option><option value="1">si</option></select></label><label>Data consenso scritto<input id="dca" type="date"></label><label>Nishu menkyo<select id="dnm"><option value="1">si</option><option value="0">in corso</option></select></label><button class="b" id="dsave2">Aggiungi</button></div></div>
  <h3>Operatori</h3><table><tr><th>ID</th><th>Nome</th><th>Tipo</th><th>Citta</th><th>Referente</th><th>Email</th><th>Provvigione %</th><th>Intestazione fattura</th><th>Email fatture</th><th></th></tr>${OPS.map(o=>`<tr data-op="${o.id}"><td>${o.id}</td><td>${esc(o.name)}</td><td>${o.type}</td><td>${esc(o.city)}</td><td>${esc(o.contact_name)}</td><td>${esc(o.email)}</td><td><input type="number" step="0.5" min="0" max="50" data-o="fee" value="${Math.round((o.fee_rate??0.1)*1000)/10}"></td><td><input data-o="billing_name" value="${esc(o.billing_name||"")}" placeholder="株式会社○○"></td><td><input data-o="billing_email" value="${esc(o.billing_email||"")}"></td><td><button class="b s" data-osv>Salva</button></td></tr>`).join("")}</table>
  <h3>Autisti</h3><table><tr><th>ID</th><th>Nome</th><th>Operatore</th><th>Lingue</th><th>Nishu</th><th>Visibilita</th><th>Consenso</th></tr>${DRV.map(d=>`<tr><td>${d.id}</td><td>${esc(d.full_name)}<br><small>${esc(d.name_latin||"")}</small></td><td>${esc(d.operator_name||(d.employed_by_us?"nostro dipendente":""))}</td><td>${langs(d.languages)}</td><td>${d.nishu_menkyo?"si":"in corso"}</td><td>${d.display_mode==="full"?"nome":"iniziali"}${d.show_operator?" + operatore":""}</td><td>${d10(d.consent_at)||'<span class="tag revoked">manca</span>'}</td></tr>`).join("")}</table>`;
  app.querySelectorAll("[data-osv]").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr");await api("/operators/"+tr.dataset.op,{fee_rate:Number(tr.querySelector('[data-o="fee"]').value)/100,billing_name:tr.querySelector('[data-o="billing_name"]').value,billing_email:tr.querySelector('[data-o="billing_email"]').value});toast("Operatore aggiornato")});
  $("#osave").onclick=async()=>{await api("/operators",{name:$("#on").value,type:$("#ot").value,city:$("#oc").value,contact_name:$("#ocn").value,email:$("#oe").value,lang:$("#ol").value});toast("Operatore aggiunto");people()};
  $("#dsave2").onclick=async()=>{const op=$("#dop").value;await api("/drivers",{full_name:$("#dn2").value,name_latin:$("#dnl").value,operator_id:op||null,employed_by_us:op?0:1,languages:$("#dlg2").value.split(",").map(s=>s.trim()).filter(Boolean),display_mode:$("#ddm").value,show_operator:$("#dso").value==="1",consent_at:$("#dca").value||null,nishu_menkyo:$("#dnm").value});toast("Autista aggiunto");people()};
}

// ---- Sessioni
let TEACHERS=[];
async function courses(){
  if(ME.role==="admin"){await loadPeople();TEACHERS=(await api("/users")).rows.filter(u=>u.role==="teacher"&&u.status==="active")}
  const rows=(await api("/courses")).rows;
  app.innerHTML=(ME.role==="admin"?`<div class="panel"><h3>Nuova sessione</h3><div class="row"><label>Operatore<select id="co">${OPS.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></label><label>Formato<select id="cf"><option value="full3">3 giorni</option><option value="day1">solo giorno 1</option><option value="lang_module">modulo lingua</option><option value="renewal">rinnovo</option></select></label><label>Lingua di erogazione<select id="cl"><option value="ja">ja</option><option value="zh">zh</option></select></label><label>Giorno 1<input id="c1" type="date"></label><label>Giorno 2<input id="c2" type="date"></label><label>Giorno 3<input id="c3" type="date"></label><label>Sede<input id="cv"></label><label>Docente<select id="ct"><option value="">admin</option>${TEACHERS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Posti<input id="cs" type="number" value="6"></label><label>Prezzo (yen)<input id="cp" type="number"></label><button class="b" id="csave">Crea</button></div></div>`:"")+
  `<h3>Calendario</h3><table><tr><th>ID</th><th>Date</th><th>Operatore</th><th>Formato</th><th>Lingua</th><th>Sede</th><th>Docente</th><th>Iscritti</th><th>Stato</th><th></th></tr>${rows.map(c=>`<tr><td>${c.id}</td><td>${[c.day1_date,c.day2_date,c.day3_date].filter(Boolean).join(" · ")}</td><td>${esc(c.operator_name)}</td><td>${c.format}</td><td>${c.language}</td><td>${esc(c.venue)}</td><td>${esc(c.teacher_name||"admin")}</td><td>${c.enrolled}/${c.seats??""}</td><td>${ME.role==="admin"?`<select data-cs="${c.id}">${["planned","confirmed","running","done","cancelled"].map(s=>`<option${s===c.status?" selected":""}>${s}</option>`).join("")}</select>`:c.status}</td><td><button class="b s" data-open="${c.id}">Apri</button></td></tr>`).join("")}</table><div id="cdet"></div>`;
  const cs=$("#csave");if(cs)cs.onclick=async()=>{await api("/courses",{operator_id:$("#co").value,format:$("#cf").value,language:$("#cl").value,day1_date:$("#c1").value,day2_date:$("#c2").value,day3_date:$("#c3").value,venue:$("#cv").value,teacher_id:$("#ct").value||null,seats:$("#cs").value,price_jpy:$("#cp").value});toast("Sessione creata");courses()};
  app.querySelectorAll("[data-cs]").forEach(s=>s.onchange=async()=>{await api("/courses/"+s.dataset.cs,{status:s.value});toast("Stato aggiornato")});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>courseDetail(b.dataset.open));
}
async function courseDetail(id){
  const rows=(await api(`/courses/${id}/enrollments`)).rows;
  const cand=DRV.filter(d=>!rows.some(r=>r.driver_id===d.id));
  $("#cdet").innerHTML=`<div class="panel"><h3>Sessione ${id}</h3>${ME.role==="admin"?`<div class="row"><label>Iscrivi autista<select id="ed">${cand.map(d=>`<option value="${d.id}">${esc(d.full_name)} (${esc(d.operator_name||"nostro")})</option>`).join("")}</select></label><button class="b" id="eadd">Iscrivi</button></div>`:""}
  <p style="color:#5b6875">Soglia di superamento: 70 su 100 per ciascuna prova. Il certificato si emette solo con le tre prove superate e il consenso dell'autista registrato.</p>
  <table><tr><th>Autista</th><th>G1</th><th>G2</th><th>G3</th><th>Orale</th><th>Pratica</th><th>Scritto</th><th>Esito</th><th>Ripetizione entro</th><th></th></tr>${rows.map(r=>`<tr data-e="${r.id}"><td>${esc(r.full_name)}</td>${["attended_d1","attended_d2","attended_d3"].map(k=>`<td><input type="checkbox" data-k="${k}"${r[k]?" checked":""}></td>`).join("")}${["score_oral","score_practical","score_written"].map(k=>`<td><input type="number" min="0" max="100" data-k="${k}" value="${r[k]??""}"></td>`).join("")}<td><span class="tag ${r.result}">${r.result}</span></td><td>${r.retake_until||""}</td><td><button class="b s" data-save>Salva</button> ${ME.role==="admin"&&r.result==="pass"&&!r.certificate_id?`<button class="b" data-issue="${r.id}" data-langs='${esc(r.driver_langs||"[]")}'>Emetti certificato</button>`:""}${ME.role==="admin"&&!r.attestation_id&&(r.format==="full3"?(r.attended_d1&&r.attended_d2&&r.attended_d3):r.attended_d1)?` <button class="b s" data-att="${r.id}" data-langs='${esc(r.driver_langs||"[]")}'>Emetti attestato</button>`:""}${r.certificate_id?` <span class="tag active">cert ${r.certificate_id}</span>`:""}${r.attestation_id?` <span class="tag">att ${r.attestation_id}</span>`:""}</td></tr>`).join("")}</table></div>`;
  const ea=$("#eadd");if(ea)ea.onclick=async()=>{await api("/enrollments",{course_id:id,driver_id:$("#ed").value});courseDetail(id)};
  $("#cdet").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr"),o={};tr.querySelectorAll("[data-k]").forEach(i=>{o[i.dataset.k]=i.type==="checkbox"?i.checked:(i.value===""?null:i.value)});const j=await api("/enrollments/"+tr.dataset.e,o);toast("Esito: "+j.result);courseDetail(id)});
  $("#cdet").querySelectorAll("[data-att]").forEach(b=>b.onclick=async()=>{const j=await api("/certificates/issue",{enrollment_id:b.dataset.att,kind:"attestation",languages:JSON.parse(b.dataset.langs)});toast("Attestato "+j.id);courseDetail(id)});

  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{if(b.dataset.st==="void"&&!confirm("Annullare l'estratto? Le segnalazioni tornano modificabili."))return;await api("/statements/"+b.dataset.id,{status:b.dataset.st});toast("Aggiornato");stmts()});
}

// ---- HDJ Academy
let acadTab="lessons";
async function acad(){
  if(ME.role==="operator")return acadLearnersOp();
  app.innerHTML=`<div class="sub">${[["lessons","Lezioni"],["questions","Domande d'esame"],["learners","Allievi"]].map(([k,t])=>`<button data-k="${k}" class="${k===acadTab?"on":""}">${t}</button>`).join("")} <a href="/academy/" target="_blank" style="margin-left:auto;align-self:center">Apri l'Academy ↗</a></div><div id="acb"></div>`;
  app.querySelector(".sub").onclick=e=>{const b=e.target.closest("button");if(b){acadTab=b.dataset.k;acad()}};
  ({lessons:acadLessons,questions:acadQuestions,learners:acadLearners})[acadTab]();
}
async function acadLessons(){
  const rows=(await api("/academy/lessons")).rows;const box=$("#acb");
  const mb=b=>b?(b/1048576).toFixed(0)+" MB":"";
  box.innerHTML=`<p style="color:#5b6875">Carica il video (MP4 dal telefono va bene), poi "Pubblica". Gli allievi vedono solo le lezioni pubblicate; l'esame si sblocca quando hanno visto almeno il 90% di ognuna.</p>
  <table><tr><th>N.</th><th>Giorno</th><th>Titolo</th><th>Video</th><th>Stato</th><th>Completate</th><th></th></tr>${rows.map(l=>`<tr data-id="${l.id}"><td>${l.position}</td><td>${l.day}</td><td><b>${esc(l.title_ja)}</b><br><small>${esc(l.title_en||"")}</small></td><td>${l.video_key?`✓ ${mb(l.video_bytes)}${l.duration_s?" · "+Math.round(l.duration_s/60)+" min":""}<br><a href="${l.preview_url}" target="_blank">anteprima</a>`:'<span class="tag revoked">manca</span>'}${l.pdf_url?`<br><a href="${l.pdf_url}" target="_blank">dispensa PDF</a>`:""}<div class="up" style="font-size:12px;color:#5b6875"></div></td><td><span class="tag ${l.status==="published"?"active":""}">${l.status==="published"?"pubblicata":"bozza"}</span></td><td>${l.completions}</td>
  <td><label class="b s" style="display:inline-block;cursor:pointer">Carica video<input type="file" accept="video/mp4,video/quicktime,video/webm" data-up hidden></label> <button class="b s" data-ed>Testi</button> ${l.status==="published"?`<button class="b s" data-st="draft">Ritira</button>`:`<button class="b" data-st="published">Pubblica</button>`}</td></tr>`).join("")}</table>
  <div class="panel"><h3>Nuova lezione</h3><div class="row"><label>Giorno<select id="nld"><option value="1">1 · standard VVIP</option><option value="2">2 · lingua</option></select></label><label>Titolo giapponese<input id="nlj"></label><label>Titolo inglese<input id="nle"></label><button class="b" id="nls">Aggiungi</button></div></div>`;
  $("#nls").onclick=async()=>{await api("/academy/lessons",{day:$("#nld").value,title_ja:$("#nlj").value,title_en:$("#nle").value});toast("Lezione aggiunta");acadLessons()};
  box.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{await api("/academy/lessons/"+b.closest("tr").dataset.id,{status:b.dataset.st});toast("Aggiornato");acadLessons()});
  box.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>lessonDlg(rows.find(r=>r.id===b.closest("tr").dataset.id)));
  box.querySelectorAll("[data-up]").forEach(inp=>inp.onchange=()=>{if(inp.files[0])uploadVideo(inp.closest("tr").dataset.id,inp.files[0],inp.closest("tr").querySelector(".up"))});
}
function lessonDlg(l){
  $("#dlgin").innerHTML=`<h3>${esc(l.id)} · testi</h3><div class="row"><label>Titolo JA<input id="tj" value="${esc(l.title_ja)}"></label><label>Titolo EN<input id="te" value="${esc(l.title_en||"")}"></label><label>Posizione<input id="tp" type="number" value="${l.position}"></label></div>
  <div class="row"><label>Riassunto JA<input id="sj" value="${esc(l.summary_ja||"")}"></label><label>Riassunto EN<input id="se" value="${esc(l.summary_en||"")}"></label></div>
  <label style="font-size:12px;color:#5b6875">Scheda di studio JA (una riga che inizia con "- " diventa un punto elenco)<textarea id="nj" rows="6">${esc(l.notes_ja||"")}</textarea></label>
  <label style="font-size:12px;color:#5b6875">Scheda di studio EN<textarea id="ne" rows="6">${esc(l.notes_en||"")}</textarea></label>
  <p class="row"><button class="b" id="tsv">Salva</button><button class="b s" onclick="dlg.close()">Chiudi</button>${l.video_key?`<button class="b r" id="trm">Togli il video</button>`:""}</p>`;dlg.showModal();
  $("#tsv").onclick=async()=>{await api("/academy/lessons/"+l.id,{title_ja:$("#tj").value,title_en:$("#te").value,position:$("#tp").value,summary_ja:$("#sj").value,summary_en:$("#se").value,notes_ja:$("#nj").value,notes_en:$("#ne").value});dlg.close();toast("Salvato");acadLessons()};
  const rm=$("#trm");if(rm)rm.onclick=async()=>{if(!confirm("Togliere il video da questa lezione?"))return;await api("/academy/lessons/"+l.id,{remove_video:true,status:"draft"});dlg.close();acadLessons()};
}
async function uploadVideo(id,file,el){
  const CH=10*1024*1024;
  const dur=await new Promise(r=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{r(Math.round(v.duration)||null);URL.revokeObjectURL(v.src)};v.onerror=()=>r(null);v.src=URL.createObjectURL(file)});
  const st=await api("/academy/upload/start",{lesson_id:id,type:file.type});const parts=[];const n=Math.ceil(file.size/CH);
  try{for(let i=0;i<n;i++){el.textContent=`Caricamento ${Math.round(i/n*100)}% (${i}/${n})… non chiudere la pagina`;
      let tries=0,res;while(true){try{res=await fetch(`/api/admin/academy/upload/part?key=${encodeURIComponent(st.key)}&upload_id=${encodeURIComponent(st.upload_id)}&part=${i+1}`,{method:"PUT",headers:{"x-panel-token":TOKEN},body:file.slice(i*CH,(i+1)*CH)});if(res.ok)break}catch(_){}if(++tries>=3)throw new Error("part "+(i+1))}
      parts.push((await res.json()).part)}
    await api("/academy/upload/complete",{key:st.key,upload_id:st.upload_id,parts,duration_s:dur});el.textContent="Caricato ✓";toast("Video caricato");acadLessons()}
  catch(e){el.textContent="Errore nel caricamento: riprova";api("/academy/upload/abort",{key:st.key,upload_id:st.upload_id}).catch(()=>{})}
}
async function acadQuestions(){
  const rows=(await api("/academy/questions")).rows;const box=$("#acb");
  box.innerHTML=`<p style="color:#5b6875">L'esame pesca 20 domande a caso tra quelle attive. Soglia 70/100, 30 minuti.</p><p><button class="b" id="qn">Nuova domanda</button></p>
  <table><tr><th>N.</th><th>Domanda</th><th>Risposte (✓ = giusta)</th><th>Stato</th><th></th></tr>${rows.map(q=>{const o=JSON.parse(q.options_ja);return `<tr data-id="${q.id}"><td>${q.position}</td><td>${esc(q.q_ja)}<br><small>${esc(q.q_en||"")}</small></td><td><small>${o.map((x,i)=>(i===q.correct?"✓ ":"· ")+esc(x)).join("<br>")}</small></td><td><span class="tag ${q.status==="active"?"active":""}">${q.status==="active"?"attiva":"disattivata"}</span></td><td><button class="b s" data-q>Modifica</button></td></tr>`}).join("")}</table>`;
  $("#qn").onclick=()=>qDlg(null);box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qDlg(rows.find(r=>r.id===b.closest("tr").dataset.id)));
}
function qDlg(q){const oj=q?JSON.parse(q.options_ja):["","","",""],oe=q&&q.options_en?JSON.parse(q.options_en):["","","",""];
  $("#dlgin").innerHTML=`<h3>${q?esc(q.id):"Nuova domanda"}</h3><label style="font-size:12px">Domanda JA<textarea id="qj" rows="2">${esc(q?q.q_ja:"")}</textarea></label><label style="font-size:12px">Domanda EN<textarea id="qe" rows="2">${esc(q?q.q_en||"":"")}</textarea></label>
  <table><tr><th>Giusta</th><th>Risposta JA</th><th>Risposta EN</th></tr>${[0,1,2,3].map(i=>`<tr><td><input type="radio" name="qc" value="${i}"${q&&q.correct===i?" checked":""}></td><td><input data-oj value="${esc(oj[i]||"")}"></td><td><input data-oe value="${esc(oe[i]||"")}"></td></tr>`).join("")}</table>
  <div class="row"><label>Spiegazione JA<input id="xj" value="${esc(q?q.explain_ja||"":"")}"></label><label>Spiegazione EN<input id="xe" value="${esc(q?q.explain_en||"":"")}"></label><label>Stato<select id="qs"><option value="active">attiva</option><option value="inactive"${q&&q.status==="inactive"?" selected":""}>disattivata</option></select></label></div>
  <p class="row"><button class="b" id="qsv">Salva</button><button class="b s" onclick="dlg.close()">Chiudi</button></p>`;dlg.showModal();
  $("#qsv").onclick=async()=>{const c=document.querySelector('input[name="qc"]:checked');if(!c){toast("Segna la risposta giusta");return}
    const b={q_ja:$("#qj").value,q_en:$("#qe").value,options_ja:[...document.querySelectorAll("[data-oj]")].map(i=>i.value),options_en:[...document.querySelectorAll("[data-oe]")].map(i=>i.value),correct:Number(c.value),explain_ja:$("#xj").value,explain_en:$("#xe").value,status:$("#qs").value};
    await api(q?"/academy/questions/"+q.id:"/academy/questions",b);dlg.close();toast("Salvata");acadQuestions()};
}
async function acadLearners(){
  const j=await api("/academy/learners");const box=$("#acb");
  box.innerHTML=`<p style="color:#5b6875">Gli autisti si creano in "Anagrafiche". Qui dai l'accesso: il pannello mostra il link personale una volta sola, da mandare via LINE, WhatsApp o email. Ogni autista ha ${j.attempts_included} tentativi d'esame inclusi; quelli in piu' li concedi tu (ripetizione dopo i 60 giorni a pagamento).</p>
  <table><tr><th>Autista</th><th>Azienda</th><th>Lezioni</th><th>Ultima attivita'</th><th>Esame</th><th></th></tr>${j.rows.map(d=>`<tr data-id="${d.id}"><td>${esc(d.full_name)}<br><small>${esc(d.name_latin||"")}</small></td><td>${esc(d.operator_name||"")}</td><td>${d.academy_access?`${d.lessons_done}/${j.lessons_published}`:"—"}</td><td>${d10(d.last_activity)}</td><td>${d.attempts?`${d.best_score}/100 ${d.passed?'<span class="tag active">superato</span>':'<span class="tag revoked">non superato</span>'}<br><small>tentativi ${d.attempts}/${j.attempts_included+d.academy_exam_extra}</small>`:"—"}</td>
  <td>${d.academy_access?`<button class="b s" data-link>Nuovo link</button> <button class="b s" data-extra>+1 tentativo</button> <button class="b r" data-rev>Togli accesso</button>`:`<button class="b" data-link>Dai accesso</button>`}</td></tr>`).join("")||'<tr><td colspan="6">Nessun autista in anagrafica.</td></tr>'}</table>`;
  box.querySelectorAll("[data-link]").forEach(b=>b.onclick=async()=>{const r=await api("/academy/access",{driver_id:b.closest("tr").dataset.id});$("#dlgin").innerHTML=`<h3>Link personale</h3><p>${esc(r.warning)}</p><pre>${esc(r.link)}</pre><p class="row"><button class="b" id="cpl">Copia</button><button class="b s" onclick="dlg.close()">Fatto</button></p>`;dlg.showModal();$("#cpl").onclick=()=>{navigator.clipboard.writeText(r.link);toast("Link copiato")};acadLearners()});
  box.querySelectorAll("[data-extra]").forEach(b=>b.onclick=async()=>{await api("/academy/extra-attempt",{driver_id:b.closest("tr").dataset.id});toast("Tentativo aggiunto");acadLearners()});
  box.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{if(!confirm("Togliere l'accesso all'Academy? Il link smette di funzionare."))return;await api("/academy/access",{driver_id:b.closest("tr").dataset.id,revoke:true});acadLearners()});
}
async function acadLearnersOp(){
  const j=await api("/academy/learners");
  app.innerHTML=`<p style="color:#5b6875">HDJ Academy（オンライン研修）での御社乗務員の進捗です。動画をすべて見終えると筆記試験を受けられます。3日目の実地練習と実地試験は講師が御社に伺って行います。</p>
  <table><tr><th>乗務員</th><th>動画</th><th>最終利用日</th><th>筆記試験</th></tr>${j.rows.map(d=>`<tr><td>${esc(d.full_name)}</td><td>${d.lessons_done}/${j.lessons_published}</td><td>${d10(d.last_activity)}</td><td>${d.attempts?`${d.best_score}点 ${d.passed?'<span class="tag active">合格</span>':'<span class="tag revoked">不合格</span>'}`:"未受験"}</td></tr>`).join("")||'<tr><td colspan="4">オンライン研修を受講中の乗務員はいません。</td></tr>'}</table>`;
}

// ---- Export
function exportTab(){const T=["leads_service","leads_training","driver_applications","operators","drivers","courses","enrollments","certificates","renewals","referrals","statements"];
  app.innerHTML=`<h3>Export CSV</h3><p>${T.map(t=>`<button class="b s" data-x="${t}" style="margin:4px">${t}</button>`).join("")}</p>`;
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const r=await fetch(`/api/admin/export/${b.dataset.x}.csv`,{headers:{"x-panel-token":TOKEN}});if(!r.ok){toast("Errore export");return}const bl=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=`${b.dataset.x}.csv`;a.click()})}

TOKEN?api("/me").then(j=>{ME=j.user;start()}).catch(login):login();
