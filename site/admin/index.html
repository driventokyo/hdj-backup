<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel · HIRE driver japan</title>
<link rel="icon" href="/assets/favicon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#14202b;--mut:#5b6875;--line:#d9dee3;--bg:#f4f5f7;--acc:#1d5c86;--gold:#a8842f;--ok:#1d6b3a;--err:#a1281f}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:3}
header b{color:var(--gold)}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:#cfd7de;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:#2b3a48;color:#fff}.cnt{background:var(--gold);color:var(--ink);border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:700}
#who{margin-left:auto;font-size:12px;color:#9aa6b1}
main{padding:16px;max-width:1400px;margin:0 auto}
.login{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #b9c2ca;border-radius:6px;background:#fff;width:100%}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}button.b.s{background:#fff;color:var(--acc);border:1px solid var(--acc)}button.b.r{background:var(--err)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:#e9ecef;border-radius:8px;padding:8px;min-height:120px}.col h4{margin:4px 4px 8px;font-size:12px;text-transform:uppercase;color:var(--mut)}
.it{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}.it small{color:var(--mut)}
.it .t{font-weight:600}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line)}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef1f4;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.row>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);min-width:140px;flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;background:#eef1f4}.tag.active,.tag.pass{background:#e3f3e8;color:var(--ok)}.tag.expired,.tag.retake{background:#fdf1dc;color:#8a5a00}.tag.revoked,.tag.fail{background:#fbe5e3;color:var(--err)}
dialog{border:0;border-radius:10px;max-width:720px;width:95%;padding:0}dialog .in{padding:18px}dialog pre{white-space:pre-wrap;background:#f6f7f9;padding:10px;border-radius:6px;max-height:300px;overflow:auto}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sub button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}.sub button.on{background:var(--ink);color:#fff}
.msg{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;max-width:420px}
td input[type=number]{width:70px}
</style>
</head>
<body>
<header><b>HIRE</b> driver japan · <span id="ptitle">Panel / 管理画面</span><nav id="tabs"></nav><span id="who"></span></header>
<main id="app"></main>
<dialog id="dlg"><div class="in" id="dlgin"></div></dialog>
<div class="msg" id="msg"></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
let TOKEN=null, ME=null;
// /admin/ and /instructor/ keep separate tokens so both can stay signed in in the same browser
const TK=location.pathname.startsWith("/instructor")?"hdj_token_instructor":"hdj_token";
try{TOKEN=localStorage.getItem(TK)}catch(_){}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",3500)};
async function api(path,body){const r=await fetch("/api/admin"+path,{method:body?"POST":"GET",headers:{"x-panel-token":TOKEN,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error("unauthorized")}const j=await r.json();if(!j.ok){toast("Error: "+(j.hint||j.error));throw new Error(j.error)}return j}
function logout(){try{localStorage.removeItem(TK)}catch(_){}TOKEN=null;login()}
const L={en:"English",zh:"Chinese",it:"Italian",fr:"French",es:"Spanish",ja:"Japanese",other:"Other"};
const langs=j=>{try{return JSON.parse(j||"[]").map(x=>L[x]||x).join(", ")}catch(_){return j||""}};
const d10=s=>(s||"").slice(0,10);

function login(){$("#tabs").innerHTML="";$("#who").textContent="";
  app.innerHTML=`<form class="login" id="lf"><h2>Sign in・ログイン</h2><p>Paste the access token you were given.<br>お渡ししたトークンを貼り付けてください。</p><input id="tk" type="password" autocomplete="current-password" required><p><button class="b">Sign in・ログイン</button></p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();TOKEN=$("#tk").value.trim();try{const j=await api("/me");try{localStorage.setItem(TK,TOKEN)}catch(_){}ME=j.user;start()}catch(_){toast("Invalid token")}}}

const TABS_ADMIN=[["leads","Requests"],["refs","Referrals"],["stmts","Statements"],["acad","Academy"],["docs","Documents"],["pay","Payments"],["people","Directory"],["courses","Sessions"],["certs","Certificates"],["renew","Renewals"],["users","Users"],["export","Export"]];
const TABS_TEACHER=[["docs","School documents"],["courses","My sessions"]];
const TABS_OPERATOR=[["refs","案件ボード"],["stmts","請求書"],["acad","研修の進捗"],["certs","乗務員の認証"]];
async function start(){
  const tabs=ME.role==="admin"?TABS_ADMIN:ME.role==="teacher"?TABS_TEACHER:TABS_OPERATOR;
  $("#ptitle").textContent=ME.role==="operator"?"提携事業者さま専用画面":"Panel";
  $("#who").innerHTML=ME.role==="operator"?`${esc(ME.name)} · <a href="#" id="lo" style="color:#9aa6b1">ログアウト</a>`:`${esc(ME.name)} · ${esc(ME.role)} · <a href="#" id="lo" style="color:#9aa6b1">sign out</a>`;$("#lo").onclick=e=>{e.preventDefault();logout()};
  $("#tabs").innerHTML=tabs.map(([k,t])=>`<button data-t="${k}">${t}<span class="cnt" id="c-${k}" hidden></span></button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)};
  show(tabs[0][0]);counts();setInterval(counts,60000);
}
async function counts(){try{const c=(await api("/counts")).counts;const n=(c.service||0)+(c.training||0)+(c.driver||0);const a=$("#c-leads");if(a){a.hidden=!n;a.textContent=n}const r=$("#c-renew");if(r){r.hidden=!c.expiring;r.textContent=c.expiring}const o=$("#c-refs");if(o&&ME.role==="operator"){o.hidden=!c.open_jobs;o.textContent=c.open_jobs}document.title=(ME.role==="operator"?(c.open_jobs?`(${c.open_jobs}) `:"")+"案件ボード":(n?`(${n}) `:"")+"Panel")+" · HIRE driver japan"}catch(_){}}
function show(t){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({leads,refs,stmts,acad,docs,pay,people,courses,certs,renew,users,exp:exportTab,export:exportTab})[t]()}

// ---- Requests: pipeline
let leadKind="service";
const STAGES={service:["new","contacted","quoted","confirmed","lost"],training:["new","contacted","quoted","confirmed","lost"],driver:["new","interview","documents","hired","rejected"]};
const SLAB={new:"New",contacted:"Contacted",quoted:"Quote sent",confirmed:"Confirmed",lost:"Lost",interview:"Interview",documents:"Documents",hired:"Hired",rejected:"Rejected"};
async function leads(){
  app.innerHTML=`<div class="sub">${[["service","Companies and operators"],["training","Training"],["driver","Driver applications"]].map(([k,t])=>`<button data-k="${k}" class="${k===leadKind?"on":""}">${t}</button>`).join("")}</div><div class="kan" id="kan"></div>`;
  app.querySelector(".sub").onclick=e=>{const b=e.target.closest("button");if(b){leadKind=b.dataset.k;leads()}};
  const rows=(await api("/leads/"+leadKind)).rows;
  $("#kan").innerHTML=STAGES[leadKind].map(s=>`<div class="col"><h4>${SLAB[s]} (${rows.filter(r=>r.stage===s).length})</h4>${rows.filter(r=>r.stage===s).map(r=>`<div class="it" data-id="${r.id}"><div class="t">${esc(r.company||r.full_name)}</div><small>${esc(r.id)} · ${d10(r.created_at)} · ${esc(r.site_lang)}${r.kind?" · "+(r.kind==="corporate"?"company":r.kind==="book"?"QUICK BOOKING":"operator"):""}</small><br><small>${esc(r.plan||r.operator_type||r.license||"")} ${r.drivers_count?"· "+r.drivers_count+" drivers":""} ${r.languages?"· "+langs(r.languages):""}</small></div>`).join("")}</div>`).join("");
  $("#kan").onclick=e=>{const it=e.target.closest(".it");if(it)leadDlg(rows.find(r=>r.id===it.dataset.id))};
}
function leadDlg(r){
  const skip=["ip_hash","turnstile_ok"];const info=Object.entries(r).filter(([k,v])=>v!=null&&v!==""&&!skip.includes(k)).map(([k,v])=>`${k}: ${k==="languages"?langs(v):v}`).join("\n");
  $("#dlgin").innerHTML=`<h3>${esc(r.company||r.full_name)} <small>${esc(r.id)}</small></h3><pre>${esc(info)}</pre>
  <div class="row"><label>Status<select id="ds">${STAGES[leadKind].map(s=>`<option value="${s}"${s===r.stage?" selected":""}>${SLAB[s]}</option>`).join("")}</select></label>
  ${leadKind!=="driver"?`<label>Quote (yen, tax excluded)<input id="dq" type="number" value="${r.quote_jpy??""}"></label><label>Lost reason<input id="dl" value="${esc(r.lost_reason||"")}"></label>`:""}</div>
  <label style="font-size:12px;color:#5b6875">Internal notes<textarea id="dn" rows="3">${esc(r.notes||"")}</textarea></label>
  <p class="row"><button class="b" id="dsave">Save</button><button class="b s" onclick="dlg.close()">Close</button>${leadKind==="service"?`<button class="b s" id="mkref">Send to members</button>`:""}${leadKind==="driver"&&r.stage==="hired"&&!r.driver_id?`<button class="b s" id="mkdrv">Create driver record</button>`:""}</p>`;
  dlg.showModal();
  $("#dsave").onclick=async()=>{const b={stage:$("#ds").value,notes:$("#dn").value};if(leadKind!=="driver"){b.quote_jpy=$("#dq").value;b.lost_reason=$("#dl").value}await api(`/leads/${leadKind}/${r.id}`,b);dlg.close();toast("Saved");leads();counts()};
  const rf=$("#mkref");if(rf)rf.onclick=()=>{dlg.close();PREF={lead_id:r.id,client_name:r.contact_name,client_company:r.company,client_email:r.email,client_phone:r.phone,client_lang:r.site_lang,service_date:r.service_date,request:[r.plan,r.hours?r.hours+"h":"",r.vehicle,r.city,r.message].filter(Boolean).join(" · ")};show("refs")};
  const mk=$("#mkdrv");if(mk)mk.onclick=async()=>{const j=await api("/drivers",{full_name:r.full_name,email:r.email,phone:r.phone,languages:JSON.parse(r.languages||"[]"),nishu_menkyo:r.license==="nishu"?1:0,employed_by_us:1});toast("Driver created: "+j.id);dlg.close()};
}
const dlg=$("#dlg");

// ---- Directory
let OPS=[],DRV=[];
async function loadPeople(){OPS=ME.role==="admin"?(await api("/operators")).rows:[];DRV=(await api("/drivers")).rows}
async function people(){await loadPeople();
  app.innerHTML=`<div class="panel"><h3>New operator</h3><div class="row"><label>Company name<input id="on"></label><label>Type<select id="ot"><option value="hire">hire</option><option value="taxi">taxi</option><option value="yakuin">yakuin sougei</option><option value="hotel">hotel</option><option value="dmc">DMC</option><option value="company">company (driver service)</option><option value="other">other</option></select></label><label>City<input id="oc"></label><label>Contact person<input id="ocn"></label><label>Email<input id="oe"></label><label>Language<select id="ol"><option>ja</option><option>zh</option><option>en</option></select></label><button class="b" id="osave">Add</button></div></div>
  <div class="panel"><h3>New driver</h3><div class="row"><label>Full name<input id="dn2"></label><label>Name in Latin letters<input id="dnl"></label><label>Operator<select id="dop"><option value="">none (our employee)</option>${OPS.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></label><label>Languages (en,zh,it,fr,es)<input id="dlg2" placeholder="en,zh"></label><label>Shown on certificate<select id="ddm"><option value="initials">initials only</option><option value="full">full name</option></select></label><label>Show operator<select id="dso"><option value="0">no</option><option value="1">yes</option></select></label><label>Written consent date<input id="dca" type="date"></label><label>Nishu menkyo<select id="dnm"><option value="1">yes</option><option value="0">in progress</option></select></label><button class="b" id="dsave2">Add</button></div></div>
  <h3>Operators</h3><table><tr><th>ID</th><th>Name</th><th>Type</th><th>City</th><th>Contact</th><th>Email</th><th>Fee %</th><th>Invoice name</th><th>Invoice email</th><th></th></tr>${OPS.map(o=>`<tr data-op="${o.id}"><td>${o.id}</td><td>${esc(o.name)}</td><td>${o.type}</td><td>${esc(o.city)}</td><td>${esc(o.contact_name)}</td><td>${esc(o.email)}</td><td><input type="number" step="0.5" min="0" max="50" data-o="fee" value="${Math.round((o.fee_rate??0.1)*1000)/10}"></td><td><input data-o="billing_name" value="${esc(o.billing_name||"")}" placeholder="株式会社○○"></td><td><input data-o="billing_email" value="${esc(o.billing_email||"")}"></td><td><button class="b s" data-osv>Save</button></td></tr>`).join("")}</table>
  <h3>Drivers</h3><table><tr><th>ID</th><th>Name</th><th>Operator</th><th>Languages</th><th>Nishu</th><th>Visibility</th><th>Consent</th></tr>${DRV.map(d=>`<tr><td>${d.id}</td><td>${esc(d.full_name)}<br><small>${esc(d.name_latin||"")}</small></td><td>${esc(d.operator_name||(d.employed_by_us?"our employee":""))}</td><td>${langs(d.languages)}</td><td>${d.nishu_menkyo?"yes":"in progress"}</td><td>${d.display_mode==="full"?"name":"initials"}${d.show_operator?" + operator":""}</td><td>${d10(d.consent_at)||'<span class="tag revoked">missing</span>'}</td></tr>`).join("")}</table>`;
  app.querySelectorAll("[data-osv]").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr");await api("/operators/"+tr.dataset.op,{fee_rate:Number(tr.querySelector('[data-o="fee"]').value)/100,billing_name:tr.querySelector('[data-o="billing_name"]').value,billing_email:tr.querySelector('[data-o="billing_email"]').value});toast("Operator updated")});
  $("#osave").onclick=async()=>{await api("/operators",{name:$("#on").value,type:$("#ot").value,city:$("#oc").value,contact_name:$("#ocn").value,email:$("#oe").value,lang:$("#ol").value});toast("Operator added");people()};
  $("#dsave2").onclick=async()=>{const op=$("#dop").value;await api("/drivers",{full_name:$("#dn2").value,name_latin:$("#dnl").value,operator_id:op||null,employed_by_us:op?0:1,languages:$("#dlg2").value.split(",").map(s=>s.trim()).filter(Boolean),display_mode:$("#ddm").value,show_operator:$("#dso").value==="1",consent_at:$("#dca").value||null,nishu_menkyo:$("#dnm").value});toast("Driver added");people()};
}

// ---- Sessions
let TEACHERS=[];
async function courses(){
  if(ME.role==="admin"){await loadPeople();TEACHERS=(await api("/users")).rows.filter(u=>u.role==="teacher"&&u.status==="active")}
  const rows=(await api("/courses")).rows;
  app.innerHTML=(ME.role==="admin"?`<div class="panel"><h3>New session</h3><div class="row"><label>Operator<select id="co">${OPS.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></label><label>Format<select id="cf"><option value="full3">3 days</option><option value="day1">day 1 only</option><option value="lang_module">language module</option><option value="renewal">renewal</option></select></label><label>Teaching language<select id="cl"><option value="ja">ja</option><option value="zh">zh</option></select></label><label>Day 1<input id="c1" type="date"></label><label>Day 2<input id="c2" type="date"></label><label>Day 3<input id="c3" type="date"></label><label>Venue<input id="cv"></label><label>Instructor<select id="ct"><option value="">admin</option>${TEACHERS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Seats<input id="cs" type="number" value="6"></label><label>Price (yen)<input id="cp" type="number"></label><button class="b" id="csave">Create</button></div></div>`:"")+
  `<h3>Calendar</h3><table><tr><th>ID</th><th>Dates</th><th>Operator</th><th>Format</th><th>Language</th><th>Venue</th><th>Instructor</th><th>Enrolled</th><th>Status</th><th></th></tr>${rows.map(c=>`<tr><td>${c.id}</td><td>${[c.day1_date,c.day2_date,c.day3_date].filter(Boolean).join(" · ")}</td><td>${esc(c.operator_name)}</td><td>${c.format}</td><td>${c.language}</td><td>${esc(c.venue)}</td><td>${esc(c.teacher_name||"admin")}</td><td>${c.enrolled}/${c.seats??""}</td><td>${ME.role==="admin"?`<select data-cs="${c.id}">${["planned","confirmed","running","done","cancelled"].map(s=>`<option${s===c.status?" selected":""}>${s}</option>`).join("")}</select>`:c.status}</td><td><button class="b s" data-open="${c.id}">Open</button></td></tr>`).join("")}</table><div id="cdet"></div>`;
  const cs=$("#csave");if(cs)cs.onclick=async()=>{await api("/courses",{operator_id:$("#co").value,format:$("#cf").value,language:$("#cl").value,day1_date:$("#c1").value,day2_date:$("#c2").value,day3_date:$("#c3").value,venue:$("#cv").value,teacher_id:$("#ct").value||null,seats:$("#cs").value,price_jpy:$("#cp").value});toast("Session created");courses()};
  app.querySelectorAll("[data-cs]").forEach(s=>s.onchange=async()=>{await api("/courses/"+s.dataset.cs,{status:s.value});toast("Status updated")});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>courseDetail(b.dataset.open));
}
async function courseDetail(id){
  const rows=(await api(`/courses/${id}/enrollments`)).rows;
  const cand=DRV.filter(d=>!rows.some(r=>r.driver_id===d.id));
  $("#cdet").innerHTML=`<div class="panel"><h3>Session ${id}</h3>${ME.role==="admin"?`<div class="row"><label>Enrol driver<select id="ed">${cand.map(d=>`<option value="${d.id}">${esc(d.full_name)} (${esc(d.operator_name||"ours")})</option>`).join("")}</select></label><button class="b" id="eadd">Enrol</button></div>`:""}
  <p style="color:#5b6875">Pass mark: 70 out of 100 for each test. The certificate is issued only when all three tests are passed and the driver's consent is on file.</p>
  <table><tr><th>Driver</th><th>D1</th><th>D2</th><th>D3</th><th>Oral</th><th>Practical</th><th>Written</th><th>Result</th><th>Retake by</th><th></th></tr>${rows.map(r=>`<tr data-e="${r.id}"><td>${esc(r.full_name)}</td>${["attended_d1","attended_d2","attended_d3"].map(k=>`<td><input type="checkbox" data-k="${k}"${r[k]?" checked":""}></td>`).join("")}${["score_oral","score_practical","score_written"].map(k=>`<td><input type="number" min="0" max="100" data-k="${k}" value="${r[k]??""}"></td>`).join("")}<td><span class="tag ${r.result}">${r.result}</span></td><td>${r.retake_until||""}</td><td><button class="b s" data-save>Save</button> ${ME.role==="admin"&&r.result==="pass"&&!r.certificate_id?`<button class="b" data-issue="${r.id}" data-langs='${esc(r.driver_langs||"[]")}'>Issue certificate</button>`:""}${ME.role==="admin"&&!r.attestation_id&&(r.format==="full3"?(r.attended_d1&&r.attended_d2&&r.attended_d3):r.attended_d1)?` <button class="b s" data-att="${r.id}" data-langs='${esc(r.driver_langs||"[]")}'>Issue attestation</button>`:""}${r.certificate_id?` <span class="tag active">cert ${r.certificate_id}</span>`:""}${r.attestation_id?` <span class="tag">att ${r.attestation_id}</span>`:""}</td></tr>`).join("")}</table></div>`;
  const ea=$("#eadd");if(ea)ea.onclick=async()=>{await api("/enrollments",{course_id:id,driver_id:$("#ed").value});courseDetail(id)};
  $("#cdet").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr"),o={};tr.querySelectorAll("[data-k]").forEach(i=>{o[i.dataset.k]=i.type==="checkbox"?i.checked:(i.value===""?null:i.value)});const j=await api("/enrollments/"+tr.dataset.e,o);toast("Result: "+j.result);courseDetail(id)});
  $("#cdet").querySelectorAll("[data-att]").forEach(b=>b.onclick=async()=>{const j=await api("/certificates/issue",{enrollment_id:b.dataset.att,kind:"attestation",languages:JSON.parse(b.dataset.langs)});toast("Attestation "+j.id);courseDetail(id)});
  $("#cdet").querySelectorAll("[data-issue]").forEach(b=>b.onclick=async()=>{const lv=confirm("Advanced level? OK = advanced, Cancel = standard")?"advanced":"standard";const j=await api("/certificates/issue",{enrollment_id:b.dataset.issue,level:lv,languages:JSON.parse(b.dataset.langs)});toast("Certificate "+j.id);courseDetail(id)});
}

// ---- Certificates and badges
async function certs(){
  const rows=(await api("/certificates")).rows;
  app.innerHTML=`<div class="row"><label>Search<input id="cq" placeholder="number, name, operator"></label></div><table id="ctab"><tr><th>Number</th><th>Type</th><th>Driver</th><th>Operator</th><th>Level</th><th>Languages</th><th>Issued</th><th>Expires</th><th>Status</th><th>Views</th><th></th></tr>${rows.map(c=>`<tr data-s="${esc((c.id+" "+c.full_name+" "+(c.operator_name||"")).toLowerCase())}"><td>${c.id}</td><td>${c.kind==="attestation"?"attestation":"certificate"}</td><td>${esc(c.full_name)}</td><td>${esc(c.operator_name||"")}</td><td>${c.level}</td><td>${langs(c.languages)}</td><td>${c.issued_at}</td><td>${c.expires_at==="9999-12-31"?"no expiry":c.expires_at}</td><td><span class="tag ${c.status}">${c.status}</span></td><td>${c.views}</td><td><button class="b s" data-png="${c.id}">PNG</button> <button class="b s" data-pdf="${c.id}">PDF</button> <button class="b s" data-copy="${esc(c.verify_url)}">Link</button>${ME.role==="admin"&&c.status==="active"?` <button class="b r" data-rev="${c.id}">Revoke</button>`:""}</td></tr>`).join("")}</table>`;
  $("#cq").oninput=e=>{const q=e.target.value.toLowerCase();app.querySelectorAll("#ctab tr[data-s]").forEach(tr=>tr.style.display=tr.dataset.s.includes(q)?"":"none")};
  const find=id=>rows.find(r=>r.id===id);
  app.querySelectorAll("[data-png]").forEach(b=>b.onclick=()=>badgePNG(find(b.dataset.png)));
  app.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>badgePDF(find(b.dataset.pdf)));
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy);toast("Verification link copied")});
  app.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{const r=prompt("Reason for revocation");if(r===null)return;await api(`/certificates/${b.dataset.rev}/revoke`,{reason:r});toast("Revoked");certs()});
}
function qrURL(text,cell){const q=qrcode(0,"M");q.addData(text);q.make();return q.createDataURL(cell,cell*2)}
function badgeName(c){return c.name_latin||c.full_name}
function docLabel(c){return c.kind==="attestation"?"Attestation of completion":"VVIP Service Certificate"}
function badgePNG(c){
  const W=1012,H=638,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  x.fillStyle="#14110E";x.fillRect(0,0,W,H);x.fillStyle="#C7A36A";x.fillRect(0,H-10,W,10);
  x.strokeStyle="#C7A36A";x.lineWidth=3;x.beginPath();[[57,40],[79,40],[96,57],[96,79],[79,96],[57,96],[40,79],[40,57]].forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.stroke();x.fillStyle="#C7A36A";x.font="600 34px Georgia,serif";x.textAlign="center";x.fillText("H",68,80);x.textAlign="left";
  x.fillStyle="#C7A36A";x.font="600 26px Georgia,serif";x.fillText("HIRE",112,66);const hw=x.measureText("HIRE ").width;x.fillStyle="#F1EADC";x.font="300 20px system-ui";x.fillText("driver japan",112+hw,66);x.fillStyle="#b9c3cc";x.font="16px system-ui";x.fillText(docLabel(c),112,90);
  x.fillStyle="#fff";x.font="700 44px system-ui";x.fillText(badgeName(c),40,220);
  x.fillStyle="#b9c3cc";x.font="20px system-ui";
  [["No.",c.id],["Level",c.level],["Languages",langs(c.languages)],["Valid until",c.expires_at==="9999-12-31"?"No expiry":c.expires_at]].forEach(([k,v],i)=>{x.fillStyle="#8a97a3";x.fillText(k,40,290+i*48);x.fillStyle="#fff";x.font="600 22px system-ui";x.fillText(v,200,290+i*48);x.font="20px system-ui"});
  x.fillStyle="#8a97a3";x.font="14px system-ui";x.fillText("Private document issued by HIRE driver japan. Not a national qualification.",40,H-40);
  const img=new Image();img.onload=()=>{x.fillStyle="#fff";x.fillRect(W-300,170,260,260);x.drawImage(img,W-290,180,240,240);x.fillStyle="#b9c3cc";x.font="14px system-ui";x.textAlign="center";x.fillText("Scan to verify",W-170,455);
    const a=document.createElement("a");a.download=`badge-${c.id}.png`;a.href=cv.toDataURL("image/png");a.click()};
  img.src=qrURL(c.verify_url,8);
}
function badgePDF(c){
  const w=window.open("","_blank");if(!w){toast("Allow pop-ups to print");return}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Badge ${c.id}</title><style>@page{size:86mm 54mm;margin:0}body{margin:0;font-family:system-ui,"Hiragino Sans","PingFang SC",sans-serif}
  .c{width:86mm;height:54mm;background:#14110E;color:#fff;padding:4mm;box-sizing:border-box;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .b{font-size:3mm;color:#C7A36A;letter-spacing:.06em;font-weight:700}.n{font-size:4.6mm;font-weight:700;margin:3mm 0 2mm}.k{font-size:2.4mm;color:#8a97a3}.v{font-size:2.8mm;margin-bottom:1mm}
  .q{position:absolute;right:4mm;top:12mm;background:#fff;padding:1mm}.q img{width:22mm;height:22mm;display:block}.f{position:absolute;left:4mm;bottom:3mm;font-size:1.8mm;color:#8a97a3;right:4mm}</style></head><body>
  <div class="c"><div class="b">HIRE driver japan · ${esc(docLabel(c))}</div><div class="n">${esc(badgeName(c))}</div>
  <div class="k">No.</div><div class="v">${c.id}</div><div class="k">Languages</div><div class="v">${esc(langs(c.languages))}</div><div class="k">Valid until</div><div class="v">${c.expires_at==="9999-12-31"?"No expiry":c.expires_at}</div>
  <div class="q"><img src="${qrURL(c.verify_url,6)}" alt=""></div><div class="f">Private document issued by HIRE driver japan. Not a national qualification. Verify: scan the QR code.</div></div>
  <script>setTimeout(function(){window.print()},300)<\/script></body></html>`);w.document.close();
}

async function uploadVideo(id,file,el){
  const CH=10*1024*1024;
  const dur=await new Promise(r=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{r(Math.round(v.duration)||null);URL.revokeObjectURL(v.src)};v.onerror=()=>r(null);v.src=URL.createObjectURL(file)});
  const st=await api("/academy/upload/start",{lesson_id:id,type:file.type});const parts=[];const n=Math.ceil(file.size/CH);
  try{for(let i=0;i<n;i++){el.textContent=`Uploading ${Math.round(i/n*100)}% (${i}/${n})… do not close the page`;
      let tries=0,res;while(true){try{res=await fetch(`/api/admin/academy/upload/part?key=${encodeURIComponent(st.key)}&upload_id=${encodeURIComponent(st.upload_id)}&part=${i+1}`,{method:"PUT",headers:{"x-panel-token":TOKEN},body:file.slice(i*CH,(i+1)*CH)});if(res.ok)break}catch(_){}if(++tries>=3)throw new Error("part "+(i+1))}
      parts.push((await res.json()).part)}
    await api("/academy/upload/complete",{key:st.key,upload_id:st.upload_id,parts,duration_s:dur});el.textContent="Uploaded ✓";toast("Video uploaded");acadLessons()}
  catch(e){el.textContent="Upload error: try again";api("/academy/upload/abort",{key:st.key,upload_id:st.upload_id}).catch(()=>{})}
}
async function acadQuestions(){

  <table><tr><th>No.</th><th>Question</th><th>Answers (✓ = correct)</th><th>Status</th><th></th></tr>${rows.map(q=>{const o=JSON.parse(q.options_ja);return `<tr data-id="${q.id}"><td>${q.position}</td><td>${esc(q.q_ja)}<br><small>${esc(q.q_en||"")}</small></td><td><small>${o.map((x,i)=>(i===q.correct?"✓ ":"· ")+esc(x)).join("<br>")}</small></td><td><span class="tag ${q.status==="active"?"active":""}">${q.status==="active"?"active":"inactive"}</span></td><td><button class="b s" data-q>Edit</button></td></tr>`}).join("")}</table>`;
  $("#qn").onclick=()=>qDlg(null);box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qDlg(rows.find(r=>r.id===b.closest("tr").dataset.id)));

function qDlg(q){const oj=q?JSON.parse(q.options_ja):["","","",""],oe=q&&q.options_en?JSON.parse(q.options_en):["","","",""];
  $("#dlgin").innerHTML=`<h3>${q?esc(q.id):"New question"}</h3><label style="font-size:12px">Question JA<textarea id="qj" rows="2">${esc(q?q.q_ja:"")}</textarea></label><label style="font-size:12px">Question EN<textarea id="qe" rows="2">${esc(q?q.q_en||"":"")}</textarea></label>
  <table><tr><th>Correct</th><th>Answer JA</th><th>Answer EN</th></tr>${[0,1,2,3].map(i=>`<tr><td><input type="radio" name="qc" value="${i}"${q&&q.correct===i?" checked":""}></td><td><input data-oj value="${esc(oj[i]||"")}"></td><td><input data-oe value="${esc(oe[i]||"")}"></td></tr>`).join("")}</table>
  <div class="row"><label>Explanation JA<input id="xj" value="${esc(q?q.explain_ja||"":"")}"></label><label>Explanation EN<input id="xe" value="${esc(q?q.explain_en||"":"")}"></label><label>Status<select id="qs"><option value="active">active</option><option value="inactive"${q&&q.status==="inactive"?" selected":""}>inactive</option></select></label></div>
  <p class="row"><button class="b" id="qsv">Save</button><button class="b s" onclick="dlg.close()">Close</button></p>`;dlg.showModal();
  $("#qsv").onclick=async()=>{const c=document.querySelector('input[name="qc"]:checked');if(!c){toast("Mark the correct answer");return}
    const b={q_ja:$("#qj").value,q_en:$("#qe").value,options_ja:[...document.querySelectorAll("[data-oj]")].map(i=>i.value),options_en:[...document.querySelectorAll("[data-oe]")].map(i=>i.value),correct:Number(c.value),explain_ja:$("#xj").value,explain_en:$("#xe").value,status:$("#qs").value};
    await api(q?"/academy/questions/"+q.id:"/academy/questions",b);dlg.close();toast("Saved");acadQuestions()};
}

  <div class="row"><label>Description (optional)<input id="pd"></label><label>Internal note<input id="pn"></label><label style="flex:0;min-width:160px">Without +5% fee<select id="pf"><option value="0">no (default)</option><option value="1">yes (exception)</option></select></label><button class="b" id="psave">Create link</button></div></div>
  <table><tr><th>Code</th><th>Date</th><th>Title</th><th>Base</th><th>Charge</th><th>Client</th><th>Request</th><th>Opens</th><th>Status</th><th></th></tr>${j.rows.map(r=>`<tr><td>${r.code}</td><td>${d10(r.created_at)}</td><td>${esc(r.title)}<br><small>${esc(r.note||"")}</small></td><td>${yen(r.base_jpy)}</td><td><b>${yen(r.amount_jpy)}</b>${r.fee_applied?"":" <small>no fee</small>"}</td><td>${esc(r.payer_email||r.email||"")}</td><td>${esc(r.ref||"")}</td><td>${r.opened}</td><td><span class="tag ${ST[r.status][1]}">${ST[r.status][0]}</span>${r.paid_at?`<br><small>${d10(r.paid_at)}</small>`:""}</td><td><button class="b s" data-cp="${r.url}">Copy link</button>${r.status==="open"?` <button class="b s" data-pm="${r.code}">Paid manually</button> <button class="b r" data-pv="${r.code}">Void</button>`:""}</td></tr>`).join("")||'<tr><td colspan="10">No links.</td></tr>'}</table>`;

// ---- School documents (admin and instructors, English)
const DOC_CAT={overview:"Programme overview",day1:"Day 1",day2:"Day 2",day3:"Day 3",standard:"Standard rules",driver:"Driver rules",vehicle:"Vehicle rules",manners:"Manners",confid:"Confidentiality and coordination",itin:"Itinerary and the unexpected",check:"Checklists",client:"Client standard",card:"Ten non-negotiables",full:"Complete programme",student:"Student handbooks",other:"Other"};
const DOC_LANG={en:"English",fr:"Français",zh:"中文",ja:"日本語",multi:"Multi"};
let docLang="all";
async function docs(){
  const j=await api("/academy/docs");const rows=j.rows.filter(r=>docLang==="all"||r.lang===docLang);
  const mb=b=>b?(b>1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB"):"";
  const groups={};for(const r of rows)(groups[r.audience+"|"+r.category]=groups[r.audience+"|"+r.category]||[]).push(r);
  app.innerHTML=`<p style="color:#5b6875">All the school documents in one place: the instructor's programme by category and language, student handbooks, checklists. Links open the PDF; they expire after four hours, reload the page for a new one.</p>
  <div class="sub">${["all","en","fr","zh","ja"].map(l=>`<button data-l="${l}" class="${l===docLang?"on":""}">${l==="all"?"All languages":DOC_LANG[l]}</button>`).join("")}</div>
  <div class="panel"><h3>Upload a document</h3><div class="row"><label>Title<input id="dt"></label><label>Category<select id="dc">${Object.entries(DOC_CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><label>Language<select id="dlg">${Object.entries(DOC_LANG).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><label>Note<input id="dn3"></label><label class="b s" style="display:inline-block;cursor:pointer;align-self:end">Choose file and upload<input type="file" id="df" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.docx,.pptx,.xlsx" hidden></label></div><div id="dup" style="font-size:12px;color:#5b6875"></div></div>
  ${Object.entries(groups).map(([k,list])=>{const [aud,cat]=k.split("|");return `<h3>${esc(DOC_CAT[cat]||cat)}${aud==="student"?` <span class="tag">students</span>`:""}</h3><table><tr><th>Title</th><th>Language</th><th>Size</th><th>Updated</th><th></th></tr>${list.map(r=>`<tr data-id="${r.id}"><td>${esc(r.title)}${r.note?`<br><small>${esc(r.note)}</small>`:""}</td><td>${DOC_LANG[r.lang]||r.lang}</td><td>${mb(r.bytes)}</td><td>${d10(r.updated_at)}</td><td>${r.url?`<a class="b s" href="${r.url}" target="_blank" rel="noopener" style="text-decoration:none">Open</a>`:""}${(ME.role==="admin"||r.uploaded_by===ME.id)&&r.r2_key.startsWith("docs/")?` <button class="b r" data-del="${r.id}">Delete</button>`:""}</td></tr>`).join("")}</table>`}).join("")||`<p>No documents yet.</p>`}`;
  app.querySelector(".sub").onclick=e=>{const b=e.target.closest("button");if(b){docLang=b.dataset.l;docs()}};
  $("#df").onchange=async()=>{const f=$("#df").files[0];if(!f)return;const el=$("#dup");el.textContent="Uploading "+f.name+"…";
    const q=new URLSearchParams({name:f.name,type:f.type||"application/octet-stream",title:$("#dt").value||f.name,category:$("#dc").value,lang:$("#dlg").value,note:$("#dn3").value});
    const r=await fetch("/api/admin/academy/docs/upload?"+q,{method:"PUT",headers:{"x-panel-token":TOKEN},body:f});const j2=await r.json();if(!j2.ok){el.textContent="Error: "+(j2.hint||j2.error);return}el.textContent="";toast("Uploaded");docs()};
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this document?"))return;await api("/academy/docs/"+b.dataset.del,{delete:true});docs()});
}
